plugins {
    id 'fabric-loom' version '1.19.4'
    id 'java'
}


version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Sources use Minecraft's intermediary names (class_1234 / method_5678),
    // so intermediary mappings let them compile without a remap pass.
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // @WrapOperation / @ModifyExpressionValue used throughout the mixin package.
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")))
}

java {
    // Loom 1.19.4 needs Java 25 to run. The mod targets 21, and --release
    // keeps any 25 API from leaking into the output.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    // Raw casts and synthetic bridges all over this tree. Warnings are noise,
    // errors are not.
    options.compilerArgs << '-nowarn'
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = ['resources']
    }
}

loom {
    mods {
        "purxiy_loader" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching('fabric.mod.json') {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Implementation-Title'  : 'SourceByDevFFnightmare DeObfDeCompByGuideX',
            'Implementation-Version': project.version,
            'Sources-By'            : 'DevFFNightmare',
            'Deobfuscated-By'       : 'GuideX'
        )
    }
}

// The 65 jars under resources/purxiy-offline load as separate classloaders, so a
// renamed class has to be pushed back into them or the first module toggle throws
// NoClassDefFoundError. jar depends on this task.
tasks.register('rebuildOfflineModules') {
    group = 'guidex'
    description = 'Rebuilds the bundled offline module jars and index from this source tree.'
    dependsOn tasks.named('classes')

    doLast {
        File classesRoot = layout.buildDirectory.dir('classes/java/main').get().asFile
        File offlineDir = layout.projectDirectory.dir('resources/purxiy-offline').asFile
        File indexFile = layout.projectDirectory.file('resources/purxiy-offline-index.json').asFile
        Map index = new groovy.json.JsonSlurper().parse(indexFile) as Map
        Map rebuilt = new LinkedHashMap()

        index.each { String id, Map meta ->
            String[] parts = meta.entrypoint.toString().split('\\.')
            String modulePackage = parts[3]
            String entrypointSimpleName = parts[-1]
            File classDir = new File(classesRoot, "dev/purxiy/modules/${modulePackage}")
            if (!classDir.isDirectory()) {
                throw new GradleException("Missing compiled classes for ${id}: ${classDir}")
            }
            if (!new File(classDir, "${entrypointSimpleName}.class").isFile()) {
                throw new GradleException("Missing entrypoint class for ${id}: ${entrypointSimpleName}")
            }

            File jarFile = new File(offlineDir, "${id}.jar")
            jarFile.parentFile.mkdirs()

            // Module code reads its shaders, sounds and data through
            // ModuleContext.resource, so keep every non-class entry.
            Map<String, byte[]> resources = new TreeMap<>()
            if (jarFile.isFile()) {
                new java.util.zip.ZipFile(jarFile).withCloseable { source ->
                    source.entries().each { sourceEntry ->
                        String name = sourceEntry.name
                        if (!sourceEntry.isDirectory()
                                && !name.endsWith('.class')
                                && name != 'META-INF/MANIFEST.MF') {
                            resources[name] = source.getInputStream(sourceEntry).bytes
                        }
                    }
                }
            }

            List<File> classFiles = []
            classDir.eachFileRecurse { File file ->
                if (file.isFile() && file.name.endsWith('.class')) {
                    classFiles << file
                }
            }
            classFiles.sort { it.path }

            java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
            int entries = 0

            jarFile.withOutputStream { raw ->
                def digestStream = new java.security.DigestOutputStream(raw, digest)
                def zip = new java.util.zip.ZipOutputStream(digestStream)
                try {
                    zip.level = java.util.zip.Deflater.BEST_COMPRESSION
                    resources.each { String name, byte[] bytes ->
                        java.util.zip.ZipEntry entry = new java.util.zip.ZipEntry(name)
                        entry.time = 1763164800000L
                        zip.putNextEntry(entry)
                        zip.write(bytes)
                        zip.closeEntry()
                        entries++
                    }
                    classFiles.each { File file ->
                        String relative = classesRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                        java.util.zip.ZipEntry entry = new java.util.zip.ZipEntry(relative)
                        entry.time = 1763164800000L
                        zip.putNextEntry(entry)
                        file.withInputStream { input -> zip << input }
                        zip.closeEntry()
                        entries++
                    }
                } finally {
                    zip.close()
                }
            }

            String sha256 = digest.digest().collect { String.format('%02x', it) }.join()
            rebuilt[id] = [
                build     : meta.build,
                sha256    : sha256,
                entrypoint: "dev.purxiy.modules.${modulePackage}.${entrypointSimpleName}",
                entries   : entries,
                packages  : ["dev.purxiy.modules.${modulePackage}."]
            ]
        }

        indexFile.setText(groovy.json.JsonOutput.toJson(rebuilt) + '\n', 'UTF-8')
        logger.lifecycle("Rebuilt ${rebuilt.size()} bundled module jars from source")

        // processResources may have run already, leaving stale jars in the
        // packaged output. Refresh them.
        File packaged = layout.buildDirectory.dir('resources/main').get().asFile
        File packagedOffline = new File(packaged, 'purxiy-offline')
        packagedOffline.mkdirs()
        packagedOffline.listFiles()?.each { File stale ->
            if (stale.name.endsWith('.jar')) {
                stale.delete()
            }
        }
        offlineDir.listFiles().findAll { it.name.endsWith('.jar') }.each { File jar ->
            new File(packagedOffline, jar.name).bytes = jar.bytes
        }
        new File(packaged, 'purxiy-offline-index.json').bytes = indexFile.bytes
    }
}

tasks.named('jar') {
    dependsOn tasks.named('rebuildOfflineModules')
}

// Compile classpath dump, read by tools/javac-check.ps1 for quick javac runs.
tasks.register('printClasspath') {
    group = 'guidex'
    description = 'Dumps the main compile classpath to build/compile-classpath.txt'
    doLast {
        File out = layout.buildDirectory.file('compile-classpath.txt').get().asFile
        out.parentFile.mkdirs()
        out.setText(sourceSets.main.compileClasspath.asPath, 'UTF-8')
        logger.lifecycle("classpath entries: ${sourceSets.main.compileClasspath.size()}")
    }
}

tasks.register('validateModuleEntrypoints', JavaExec) {
    group = 'guidex'
    description = 'Loads every bundled module entrypoint through the runtime classloader.'
    dependsOn tasks.named('classes')
    classpath = files('resources') + sourceSets.main.runtimeClasspath
    mainClass = 'dev.purxiy.loader.runtime.ModuleEntrypointAudit'
}

tasks.named('check') {
    dependsOn tasks.named('validateModuleEntrypoints')
}
